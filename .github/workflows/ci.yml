name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Smoke test imports, legacy migration, SQLite and image matching
        env:
          DISCORD_TOKEN: ci-placeholder-token
          OWNER_ID: "123456789012345678"
          DATABASE: /tmp/pokemon-detector-ci/pokemon.db
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          # Simulate the older schema used by the first repository version.
          path = Path("/tmp/pokemon-detector-ci/pokemon.db")
          path.parent.mkdir(parents=True, exist_ok=True)
          with sqlite3.connect(path) as db:
              db.execute("""
                  CREATE TABLE pokemon_images (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      name TEXT NOT NULL,
                      image_url TEXT NOT NULL UNIQUE,
                      image_hash TEXT NOT NULL,
                      variant TEXT NOT NULL DEFAULT 'normal',
                      source TEXT NOT NULL DEFAULT 'PokeAPI'
                  )
              """)
              db.execute(
                  "INSERT INTO pokemon_images(name,image_url,image_hash) VALUES(?,?,?)",
                  ("Legacymon", "https://example.com/legacy.png", "0" * 16)
              )

          import bot
          from database import init_db, image_count, save_image, get_all_hashes
          from detector import fingerprint_image, encode_fingerprint, best_match
          from PIL import Image

          init_db()
          assert image_count() == 1, "Legacy row was not preserved"
          assert get_all_hashes()[0]["pokemon_name"] == "Legacymon", "Legacy name was not migrated"

          image = Image.new("RGB", (64, 64), (120, 40, 200))
          hashes = fingerprint_image(image)
          stored = encode_fingerprint(hashes)
          save_image("CI Testmon", "https://example.com/ci-test.png", stored)
          assert image_count() == 2
          match = best_match(hashes)
          assert match and match[0] == "CI Testmon", f"Unexpected match: {match}"
          print("Imports, legacy migration, SQLite and image matching passed.")
          PY
